
  <!-- =====================================
                     CATALOGO
                ====================================== -->

                <section
                    class="catalog-section"
                    id="catalogo"
                >

                    <div class="section-header">

                        <h2>
                            NUESTRO
                            <span>CATÁLOGO</span>
                        </h2>

                        <p>
                            Explora nuestros diseños exclusivos
                            y encuentra tu estilo.
                        </p>

                    </div>


                    <!-- PRODUCTOS -->

                    <div
                        class="catalog-grid"
                        id="catalogGrid"
                    >


                        <!-- PRODUCTO 1 -->

                        <article
                            class="product-card"
                            data-product="Rayo Island"
                        >

                            <div class="product-image">

                                <img
                                    src="img/catalogo/rayo-island.png"
                                    alt="Playera Rayo Island"
                                >

                            </div>


                            <div class="product-info">

                                <h3>
                                    RAYO ISLAND
                                </h3>

                                <p class="price">
                                    $280 MXN
                                </p>

                            </div>

                        </article>



                        <!-- PRODUCTO 2 -->

                        <article
                            class="product-card"
                            data-product="Storm Kingdom"
                        >

                            <div class="product-image">

                                <img
                                    src="img/catalogo/storm-kingdom.png"
                                    alt="Playera Storm Kingdom"
                                >

                            </div>


                            <div class="product-info">

                                <h3>
                                    STORM KINGDOM
                                </h3>

                                <p class="price">
                                    $280 MXN
                                </p>

                            </div>

                        </article>



                        <!-- PRODUCTO 3 -->

                        <article
                            class="product-card"
                            data-product="Island Energy"
                        >

                            <div class="product-image">

                                <img
                                    src="img/catalogo/island-energy.png"
                                    alt="Playera Island Energy"
                                >

                            </div>


                            <div class="product-info">

                                <h3>
                                    ISLAND ENERGY
                                </h3>

                                <p class="price">
                                    $280 MXN
                                </p>

                            </div>

                        </article>

                    </div>


                    <!-- VER TODOS -->

                    <button
                        class="catalog-button"
                        id="viewCatalog"
                    >

                        VER TODOS LOS DISEÑOS

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </section>

    <!-- =========================================

 <script src="style.css"></script>
</body>
</html>
