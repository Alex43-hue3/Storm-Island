
<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

        content="Storm Island - Diseños que dejan huella."

    <title>Storm Island | Diseños que dejan huella</title>


    <!-- FUENTES -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ICONOS -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ESTILOS -->

    <link rel="stylesheet" href="style.css">
  <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="logo-storm-island.png"
                    alt="Storm Island"
                >

            </a>



            <!-- MENU -->

            <nav class="nav">

                <a
                    href="index.html"
                    class="nav-link active"
                >
                    Inicio
                </a>


                <a
                    href="catalogo.html"
                    class="nav-link"
                >
                    Catálogo
                </a>


                <a
                    href="mockup.html"
                    class="nav-link"
                >
                    Crea tu Mockup
                </a>


                <a
                    href="nosotros.html"
                    class="nav-link"
                >
                    Sobre Nosotros
                </a>


                <a
                    href="contacto.html"
                    class="nav-link"
                >
                    Contacto
                </a>

            </nav>



            <!-- WHATSAPP -->

            <a
                href="https://wa.me/528281017352"
                class="whatsapp-header"
                target="_blank"
                rel="noopener noreferrer"
            >

                <i class="fa-brands fa-whatsapp"></i>

                <span>

                    <strong>WhatsApp</strong>

                    <small>Escríbenos</small>

                </span>

            </a>



            <!-- MENU MOVIL -->

            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="Abrir menú"
            >

                <i class="fa-solid fa-bars"></i>

            </button>


        </div>

    </header>



</head>


<body>

                <!-- =====================================
                     MOCKUP
                ====================================== -->

                <section
                    class="mockup-section"
                    id="mockup"
                >

                    <div class="section-header">

                        <h2>
                            CREA TU PROPIO
                            <span>MOCKUP</span>
                        </h2>

                        <p>
                            Sube tu diseño y mira cómo quedaría
                            en tu playera favorita.
                        </p>

                    </div>


                    <div class="mockup-content">


                        <!-- PLAYERA -->

                        <div class="mockup-preview">

                            <div
                                class="shirt-container"
                                id="shirtContainer"
                            >

                                <img
                                    src="playera-negra.jpeg"
                                    id="shirtPreview"
                                    alt="Vista previa de playera"
                                >


                                <!-- DISEÑO DEL CLIENTE -->

                                <div
                                    class="design-preview"
                                    id="designPreview"
                                >

                                    <span class="upload-placeholder">

                                        <i class="fa-solid fa-cloud-arrow-up"></i>

                                        <strong>
                                            SUBIR DISEÑO
                                        </strong>

                                        <small>
                                            PNG / JPG
                                        </small>

                                    </span>

                                </div>

                            </div>

                        </div>



                        <!-- CONTROLES -->

                        <div class="mockup-controls">


                            <!-- SUBIR DISEÑO -->

                            <div class="control-group">

                                <h3>
                                    TU DISEÑO
                                </h3>

                                <label
                                    for="designUpload"
                                    class="upload-button"
                                >

                                    <i class="fa-solid fa-upload"></i>

                                    SUBIR DISEÑO

                                </label>

                                <input
                                    type="file"
                                    id="designUpload"
                                    accept="image/png,image/jpeg,image/webp"
                                    hidden
                                >

                                <p class="upload-info">
                                    Formatos permitidos:
                                    PNG, JPG o WEBP, Max:10mb
                                </p>

                            </div>



                            <!-- TIPO DE PLAYERA -->

                            <div class="control-group">

                                <h3>
                                    ELIGE TU PLAYERA
                                </h3>


                                <div
                                    class="shirt-options"
                                    id="shirtOptions"
                                >

                                    <button
                                        class="shirt-option active"
                                        data-shirt="negra"
                                        data-image="img/playeras/playera-negra.png"
                                        aria-label="Playera negra"
                                    >

                                        <img
                                            src="img/playeras/thumb-negra.png"
                                            alt="Negra"
                                        >

                                    </button>


                                    <button
                                        class="shirt-option"
                                        data-shirt="gris"
                                        data-image="img/playeras/playera-gris.png"
                                        aria-label="Playera gris"
                                    >

                                        <img
                                            src="img/playeras/thumb-gris.png"
                                            alt="Gris"
                                        >

                                    </button>


                                    <button
                                        class="shirt-option"
                                        data-shirt="blanca"
                                        data-image="img/playeras/playera-blanca.png"
                                        aria-label="Playera blanca"
                                    >

                                        <img
                                            src="img/playeras/thumb-blanca.png"
                                            alt="Blanca"
                                        >

                                    </button>


                                    <button
                                        class="shirt-option"
                                        data-shirt="beige"
                                        data-image="img/playeras/playera-beige.png"
                                        aria-label="Playera beige"
                                    >

                                        <img
                                            src="img/playeras/thumb-beige.png"
                                            alt="Beige"
                                        >

                                    </button>

                                </div>

                            </div>



                            <!-- COLORES -->

                            <div class="control-group">

                                <h3>
                                    COLORES DISPONIBLES
                                </h3>


                                <div class="color-options">

                                    <button
                                        class="color-option black active"
                                        data-color="negro"
                                        aria-label="Negro"
                                    ></button>


                                    <button
                                        class="color-option white"
                                        data-color="blanco"
                                        aria-label="Blanco"
                                    ></button>


                                    <button
                                        class="color-option gray"
                                        data-color="gris"
                                        aria-label="Gris"
                                    ></button>


                                    <button
                                        class="color-option gold"
                                        data-color="beige"
                                        aria-label="Beige"
                                    ></button>

                                </div>

                            </div>



                            <!-- BOTON MOCKUP -->

                            <button
                                class="generate-button"
                                id="generateMockup"
                            >

                                <i class="fa-regular fa-image"></i>

                                GENERAR MOCKUP

                            </button>


                        </div>

                    </div>

                </section>

            </div>

        </section>
    <script src="script.js"></script>
 <script src="style.css"></script>
</body>
</html>
